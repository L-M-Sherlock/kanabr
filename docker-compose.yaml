services:
  kanabr:
    build:
      dockerfile: ./Dockerfile
    environment:
      DATA_DIR: /data
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: /data/database.sqlite
    volumes:
      - ./data:/data
      - ./.env:/etc/keybr/env:ro
    ports:
      - 3000:3000
    restart: unless-stopped
